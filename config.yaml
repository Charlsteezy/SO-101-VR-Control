cameras:
  front:
    fps: 30
    height: 480
    index_or_path: /dev/video0
    width: 640
  wrist:
    fps: 30
    height: 360
    index_or_path: /dev/video2
    width: 640
control:
  keyboard:
    angle_step: 5
    enabled: true
    gripper_step: 10.0
    pos_step: 0.01
  pybullet:
    enabled: true
  vr:
    enabled: true
gripper:
  closed_angle: 45.0
  open_angle: 0.0
ik:
  hysteresis_threshold: 0.05
  movement_penalty_weight: 0.01
  position_error_threshold: 0.001
  reference_poses_file: reference_poses.json
  use_reference_poses: true
network:
  host_ip: 0.0.0.0
  https_port: 8443
  websocket_port: 8442
paths:
  urdf_path: URDF/SO100/urdf/so100.urdf
recording:
  enabled: true
  fps: 20
  repo_id: local/so101_vr
  robot_type: so101
  root: datasets
  task: pick and place
robot:
  left_arm:
    enabled: true
    name: SO-101 Arm
    port: /dev/ttyACM0
  right_arm:
    enabled: false
    name: Right Arm
    port: /dev/ttyACM_NONE
  send_interval: 0.05
  vr_to_robot_scale: 1
ssl:
  certfile: cert.pem
  keyfile: key.pem
