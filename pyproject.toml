[build-system]
requires = ["setuptools >= 61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "so101-vr-control"
version = "2.0.0"
description = "VR Teleoperation Control for SO-101 Robot Arm"
authors = [
    {name = "Emil Rofors", email = "emirof@gmail.com"},
    {name = "GetSet Robotics", email = "getsetrobotics@gmail.com"},
]
keywords = ["robotics", "teleoperation", "vr", "so101", "meta-quest", "robot-control"]

dependencies = [
    "numpy",
    "torch",
    "websockets",
    "pynput",
    "pybullet",
    "scipy",
    "pyyaml",
    "feetech-servo-sdk",
]

requires-python = ">=3.8"

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-asyncio",
    "black",
    "flake8",
    "mypy",
]
roboflow = [
    "inference-sdk",
    "supervision",
]

[project.scripts]
so101-vr = "so101_vr.main:main_cli"

[project.urls]
Homepage = "https://github.com/DipFlip/telegrip"
Repository = "https://github.com/DipFlip/telegrip"

[tool.setuptools]
packages = ["so101_vr", "so101_vr.core", "so101_vr.inputs"]
