<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 320" font-family="-apple-system, BlinkMacSystemFont, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#111113"/>
      <stop offset="100%" stop-color="#09090b"/>
    </linearGradient>
  </defs>

  <rect width="400" height="320" rx="12" fill="url(#bg)"/>
  <rect width="400" height="320" rx="12" fill="none" stroke="#27272a" stroke-width="1"/>

  <text x="200" y="32" text-anchor="middle" fill="#fff" font-size="16" font-weight="700">SO-101 VR Controller Guide</text>

  <!-- Controller outline -->
  <g transform="translate(200, 155)">
    <!-- Controller body -->
    <ellipse cx="0" cy="0" rx="55" ry="70" fill="none" stroke="#3f3f46" stroke-width="1.5"/>
    <ellipse cx="0" cy="0" rx="35" ry="45" fill="none" stroke="#27272a" stroke-width="1"/>

    <!-- Grip button areas -->
    <rect x="-58" y="-20" width="8" height="40" rx="4" fill="rgba(236,72,153,0.25)" stroke="#ec4899" stroke-width="1.2"/>
    <rect x="50" y="-20" width="8" height="40" rx="4" fill="rgba(236,72,153,0.25)" stroke="#ec4899" stroke-width="1.2"/>

    <!-- Trigger -->
    <path d="M-12,50 Q0,65 12,50" fill="none" stroke="#84cc16" stroke-width="2.5" stroke-linecap="round"/>

    <!-- Thumbstick -->
    <circle cx="0" cy="-25" r="12" fill="none" stroke="#3f3f46" stroke-width="1.2"/>
    <circle cx="0" cy="-25" r="4" fill="#52525b"/>

    <!-- Buttons -->
    <circle cx="12" cy="-5" r="5" fill="none" stroke="#3f3f46" stroke-width="1"/>
    <circle cx="-12" cy="-5" r="5" fill="none" stroke="#3f3f46" stroke-width="1"/>
    <text x="12" y="-2" text-anchor="middle" fill="#52525b" font-size="6" font-weight="700">B</text>
    <text x="-12" y="-2" text-anchor="middle" fill="#52525b" font-size="6" font-weight="700">A</text>
  </g>

  <!-- Labels -->
  <!-- Grip labels -->
  <line x1="135" y1="155" x2="105" y2="155" stroke="#ec4899" stroke-width="1" stroke-dasharray="3,3"/>
  <text x="100" y="150" text-anchor="end" fill="#ec4899" font-size="11" font-weight="700">GRIP</text>
  <text x="100" y="163" text-anchor="end" fill="#71717a" font-size="9">Hold to move</text>

  <line x1="265" y1="155" x2="295" y2="155" stroke="#ec4899" stroke-width="1" stroke-dasharray="3,3"/>
  <text x="300" y="150" text-anchor="start" fill="#ec4899" font-size="11" font-weight="700">GRIP</text>
  <text x="300" y="163" text-anchor="start" fill="#71717a" font-size="9">Hold to move</text>

  <!-- Trigger label -->
  <line x1="200" y1="215" x2="200" y2="240" stroke="#84cc16" stroke-width="1" stroke-dasharray="3,3"/>
  <text x="200" y="255" text-anchor="middle" fill="#84cc16" font-size="11" font-weight="700">TRIGGER</text>
  <text x="200" y="268" text-anchor="middle" fill="#71717a" font-size="9">Hold = close gripper</text>

  <!-- Wrist label -->
  <g transform="translate(200, 80)">
    <path d="M-30,0 Q0,-12 30,0" fill="none" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="3,3"/>
    <polygon points="30,0 24,-4 24,4" fill="#38bdf8"/>
    <polygon points="-30,0 -24,-4 -24,4" fill="#38bdf8"/>
    <text x="0" y="-8" text-anchor="middle" fill="#38bdf8" font-size="11" font-weight="700">WRIST ROTATION</text>
  </g>

  <!-- Footer -->
  <text x="200" y="305" text-anchor="middle" fill="#52525b" font-size="10">Either hand controls the SO-101 arm</text>
</svg>
